<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="600" height="900">
  <defs>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090c12"/>
      <stop offset="1" stop-color="#0d1220"/>
    </linearGradient>
    <linearGradient id="gapview" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1826"/>
      <stop offset="0.55" stop-color="#122435"/>
      <stop offset="1" stop-color="#0b1520"/>
    </linearGradient>
    <radialGradient id="mterm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#29e6d2" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#29e6d2" stop-opacity="0"/>
    </radialGradient>
    <filter id="mgrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0.05 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="300" height="450" fill="url(#court)"/>

  <!-- the gap in the wall: the between, visible -->
  <g>
    <rect x="176" y="70" width="100" height="150" fill="url(#gapview)"/>
    <!-- the shore in the gap -->
    <line x1="176" y1="164" x2="276" y2="164" stroke="#29e6d2" stroke-width="0.8" opacity="0.5"/>
    <rect x="176" y="164" width="100" height="56" fill="#0b1520"/>
    <g stroke="#29e6d2" stroke-width="0.6" opacity="0.35">
      <line x1="190" y1="180" x2="240" y2="180"/>
      <line x1="210" y1="196" x2="266" y2="196"/>
    </g>
    <!-- the engram, far, facing the water -->
    <g fill="#04060b">
      <circle cx="238" cy="128" r="6"/>
      <path d="M230 136 L246 136 L244 164 L232 164 Z"/>
      <path d="M232 142 L220 152 L224 158 L234 150 Z"/>
    </g>
    <path d="M230 136 L246 136" fill="none" stroke="#d8d2c4" stroke-width="0.8" opacity="0.4"/>
    <!-- gap frame -->
    <rect x="176" y="70" width="100" height="150" fill="none" stroke="#1c2739" stroke-width="3"/>
  </g>

  <!-- clerk's bench shadow, left -->
  <path d="M0 88 H96 V450 H0 Z" fill="#070a11"/>
  <path d="M96 88 V450" stroke="#1c2739" stroke-width="1.6"/>
  <!-- the record books on the bench -->
  <g fill="#0e1522" stroke="#26334d" stroke-width="1">
    <rect x="20" y="150" width="52" height="16"/><rect x="26" y="134" width="46" height="16"/>
    <rect x="18" y="166" width="56" height="16"/>
  </g>
  <g stroke="#3d4658" stroke-width="0.9" opacity="0.6">
    <line x1="28" y1="158" x2="64" y2="158"/><line x1="34" y1="142" x2="64" y2="142"/><line x1="26" y1="174" x2="66" y2="174"/>
  </g>

  <!-- witness crate, foreground -->
  <g>
    <rect x="60" y="330" width="180" height="120" fill="#10151f" stroke="#26334d" stroke-width="1.6"/>
    <line x1="60" y1="330" x2="240" y2="330" stroke="#37476b" stroke-width="1.4"/>
    <!-- crate slats -->
    <g stroke="#1a2436" stroke-width="1.2">
      <line x1="120" y1="330" x2="120" y2="450"/><line x1="180" y1="330" x2="180" y2="450"/>
    </g>
    <path d="M60 330 L240 330 L232 344 L68 344 Z" fill="#141c2c"/>
  </g>

  <!-- the ghost terminal on the crate -->
  <g>
    <circle cx="150" cy="268" r="34" fill="url(#mterm)"/>
    <rect x="112" y="232" width="76" height="60" fill="#0a0f18" stroke="#26334d" stroke-width="1.6"/>
    <rect x="119" y="239" width="62" height="46" fill="#07131c"/>
    <!-- no face: just the record -->
    <g fill="#29e6d2" opacity="0.75">
      <rect x="126" y="247" width="30" height="2.4"/>
      <rect x="126" y="254" width="44" height="2.4"/>
      <rect x="126" y="261" width="24" height="2.4"/>
      <rect x="126" y="268" width="40" height="2.4"/>
      <rect x="126" y="275" width="16" height="2.4"/>
    </g>
    <rect x="150" y="275" width="5" height="4" fill="#29e6d2">
      <animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="116" y="292" width="68" height="7" fill="#0c1322" stroke="#1c2739" stroke-width="1"/>
    <rect x="138" y="299" width="24" height="31" fill="#0a0f18" stroke="#1c2739" stroke-width="1"/>
  </g>

  <!-- the summons paper on the crate, foreground -->
  <g>
    <polygon points="96,392 172,388 178,434 90,440" fill="#d8d2c4" opacity="0.9"/>
    <g stroke="#5c6678" stroke-width="1.2">
      <line x1="104" y1="402" x2="162" y2="399"/>
      <line x1="103" y1="410" x2="166" y2="407"/>
      <line x1="102" y1="418" x2="152" y2="416"/>
    </g>
    <g stroke="#8a3b3b" stroke-width="1.6">
      <line x1="128" y1="424" x2="164" y2="422"/>
    </g>
  </g>

  <!-- motes in the terminal light -->
  <g fill="#29e6d2">
    <circle cx="96" cy="222" r="1" opacity="0.5"/><circle cx="196" cy="214" r="0.9" opacity="0.45"/>
    <circle cx="120" cy="204" r="0.8" opacity="0.4"/>
  </g>

  <rect width="300" height="450" filter="url(#mgrain)" opacity="0.5" fill="none"/>

  <rect x="6" y="6" width="288" height="438" fill="none" stroke="#37476b" stroke-width="1.6"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#232f45" stroke-width="0.8"/>
  <g stroke="#ffb347" stroke-width="1.6">
    <line x1="6" y1="18" x2="6" y2="6"/><line x1="6" y1="6" x2="18" y2="6"/>
    <line x1="282" y1="6" x2="294" y2="6"/><line x1="294" y1="6" x2="294" y2="18"/>
    <line x1="6" y1="432" x2="6" y2="444"/><line x1="6" y1="444" x2="18" y2="444"/>
    <line x1="282" y1="444" x2="294" y2="444"/><line x1="294" y1="444" x2="294" y2="432"/>
  </g>

  <rect x="24" y="398" width="252" height="30" fill="#070b11" opacity="0.9"/>
  <line x1="24" y1="398" x2="276" y2="398" stroke="#29e6d2" stroke-width="0.8"/>
  <text x="150" y="417" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="2.5" fill="#d8d2c4">THE MEASURE</text>
</svg>
