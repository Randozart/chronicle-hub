<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="mbay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080b11"/>
      <stop offset="1" stop-color="#0c1320"/>
    </linearGradient>
    <radialGradient id="mglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#29e6d2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#29e6d2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mscan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.1" fill="#060a12" opacity="0.55"/>
    </pattern>
    <filter id="mngrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0.05 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#mbay)"/>

  <!-- cable runs across the ceiling -->
  <g stroke="#141d30" stroke-width="2.4" fill="none">
    <path d="M0 46 q200 30 420 16 t400 18 t380 -8"/>
    <path d="M0 92 q260 24 520 8 t680 22"/>
  </g>
  <g stroke="#141d30" stroke-width="1.2">
    <line x1="150" y1="60" x2="150" y2="110"/><line x1="430" y1="66" x2="430" y2="104"/>
    <line x1="700" y1="70" x2="700" y2="100"/><line x1="980" y1="64" x2="980" y2="106"/>
  </g>

  <!-- pods, a receding row -->
  <g>
    <rect x="40" y="140" width="150" height="190" fill="#0d1626" stroke="#1c2739" stroke-width="1.8"/>
    <rect x="50" y="150" width="130" height="170" fill="#0a1220"/>
    <path d="M70 300 q6 -70 45 -70 q39 0 45 70 Z" fill="#101c30"/>
    <circle cx="115" cy="196" r="14" fill="#101c30"/>

    <rect x="230" y="128" width="170" height="212" fill="#0d1626" stroke="#1c2739" stroke-width="1.8"/>
    <rect x="242" y="140" width="146" height="190" fill="#0a1220"/>
    <path d="M266 316 q8 -80 52 -80 q44 0 52 80 Z" fill="#101c30"/>
    <circle cx="318" cy="200" r="16" fill="#101c30"/>

    <rect x="446" y="118" width="190" height="232" fill="#0d1626" stroke="#1c2739" stroke-width="1.8"/>
    <rect x="460" y="132" width="162" height="212" fill="#0a1220"/>
    <path d="M488 322 q10 -88 62 -88 q52 0 62 88 Z" fill="#101c30"/>
    <circle cx="550" cy="196" r="18" fill="#101c30"/>
  </g>

  <!-- ONE occupied pod: soft life-signs -->
  <g>
    <rect x="690" y="108" width="210" height="252" fill="#0d1626" stroke="#26334d" stroke-width="2"/>
    <rect x="704" y="122" width="182" height="224" fill="#0a1220"/>
    <path d="M736 330 q14 -100 70 -100 q56 0 70 100 Z" fill="#14243c"/>
    <circle cx="806" cy="188" r="24" fill="#14243c"/>
    <!-- breathing indicator -->
    <rect x="704" y="140" width="182" height="2" fill="#29e6d2" opacity="0.4"/>
    <circle cx="724" cy="141" r="4" fill="#29e6d2" opacity="0.8">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <!-- readout strip -->
    <g fill="#29e6d2" opacity="0.7">
      <rect x="712" y="330" width="30" height="3"/><rect x="750" y="330" width="46" height="3"/>
      <rect x="806" y="330" width="22" height="3"/><rect x="838" y="330" width="38" height="3"/>
    </g>
  </g>

  <!-- the working terminal, apart, awake -->
  <g>
    <circle cx="1060" cy="200" r="46" fill="url(#mglow)"/>
    <rect x="1004" y="156" width="112" height="88" fill="#0a0f18" stroke="#26334d" stroke-width="1.8"/>
    <rect x="1012" y="164" width="96" height="72" fill="#07131c"/>
    <ellipse cx="1060" cy="198" rx="22" ry="27" fill="#29e6d2" opacity="0.28"/>
    <ellipse cx="1060" cy="198" rx="22" ry="27" fill="url(#mscan)"/>
    <path d="M1050 190 h8 M1062 190 h8" stroke="#d8f5f0" stroke-width="1.6" opacity="0.85"/>
    <path d="M1052 210 q8 5 16 0" stroke="#d8f5f0" stroke-width="1.2" fill="none" opacity="0.65"/>
    <rect x="1010" y="244" width="100" height="8" fill="#0c1322" stroke="#1c2739" stroke-width="1"/>
  </g>

  <!-- floor: cable bundle to the pods -->
  <rect x="0" y="330" width="1200" height="70" fill="#0a0f1a"/>
  <line x1="0" y1="330" x2="1200" y2="330" stroke="#1c2739" stroke-width="1.6"/>
  <path d="M60 372 q200 -18 420 -30 t640 -26" stroke="#141d30" stroke-width="4" fill="none"/>
  <g stroke="#16203a" stroke-width="1">
    <line x1="240" y1="352" x2="240" y2="400"/><line x1="520" y1="344" x2="520" y2="400"/><line x1="840" y1="338" x2="840" y2="400"/>
  </g>

  <rect width="1200" height="400" filter="url(#mngrain)" opacity="0.5" fill="none"/>
</svg>
