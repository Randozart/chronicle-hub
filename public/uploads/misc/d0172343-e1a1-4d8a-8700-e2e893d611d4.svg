<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="600" height="900">
  <defs>
    <linearGradient id="officenight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080b11"/>
      <stop offset="1" stop-color="#0d1320"/>
    </linearGradient>
    <radialGradient id="desklamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffb347" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fogshape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa3c4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8fa3c4" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="fogblur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="irgrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0.05 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="300" height="450" fill="url(#officenight)"/>

  <!-- the window behind the desk: the street below, one dark window across -->
  <g>
    <rect x="150" y="48" width="130" height="180" fill="#0a1220" stroke="#1c2739" stroke-width="2.4"/>
    <line x1="215" y1="48" x2="215" y2="228" stroke="#1c2739" stroke-width="2"/>
    <line x1="150" y1="138" x2="280" y2="138" stroke="#1c2739" stroke-width="2"/>
    <!-- the dark window across the street -->
    <rect x="232" y="70" width="26" height="34" fill="#04060b" stroke="#131c2c" stroke-width="1.4"/>
    <!-- far lights -->
    <g fill="#ffb347" opacity="0.4">
      <rect x="164" y="70" width="3" height="4"/><rect x="186" y="96" width="3" height="4"/><rect x="244" y="150" width="3" height="4"/>
    </g>
    <g fill="#29e6d2" opacity="0.35">
      <rect x="170" y="160" width="3" height="4"/><rect x="256" y="86" width="3" height="4"/>
    </g>
    <!-- rain past the glass -->
    <g stroke="#7f93b8" stroke-width="0.7" opacity="0.3">
      <line x1="164" y1="56" x2="154" y2="100"/><line x1="200" y1="52" x2="190" y2="96"/>
      <line x1="238" y1="60" x2="228" y2="104"/><line x1="266" y1="120" x2="256" y2="164"/>
      <line x1="182" y1="150" x2="172" y2="194"/><line x1="252" y1="176" x2="242" y2="220"/>
    </g>
  </g>

  <!-- THE FOG: shaped like a doorway, at the window -->
  <g filter="url(#fogblur)">
    <path d="M186 88 q4 -22 26 -22 q22 0 26 22 l0 92 q-26 12 -52 0 Z" fill="url(#fogshape)"/>
    <path d="M199 104 q13 -10 26 0 l0 60 q-13 8 -26 0 Z" fill="#a9bdd8" opacity="0.16"/>
  </g>

  <!-- desk lamp, lit -->
  <line x1="66" y1="236" x2="66" y2="196" stroke="#37476b" stroke-width="1.6"/>
  <path d="M50 196 h32 l8 12 h-48 Z" fill="#0b1119" stroke="#ffb347" stroke-width="1.5"/>
  <circle cx="66" cy="214" r="3.4" fill="#ffb347"/>
  <circle cx="66" cy="214" r="40" fill="url(#desklamp)"/>
  <path d="M66 220 L20 330 L128 330 Z" fill="#ffb347" opacity="0.07"/>

  <!-- the desk -->
  <rect x="14" y="330" width="272" height="12" fill="#0b1119"/>
  <line x1="14" y1="330" x2="286" y2="330" stroke="#26334d" stroke-width="1.3"/>
  <rect x="26" y="342" width="14" height="60" fill="#0a0e17"/>
  <rect x="240" y="342" width="14" height="60" fill="#0a0e17"/>

  <!-- three letters, fanned -->
  <g>
    <polygon points="118,330 154,322 162,330 126,338" fill="#cfc9b8" opacity="0.75"/>
    <polygon points="136,330 172,324 180,332 144,340" fill="#d8d2c4" opacity="0.85"/>
    <polygon points="154,330 190,326 196,334 160,342" fill="#cfc9b8" opacity="0.8"/>
    <g stroke="#5c6678" stroke-width="0.9">
      <line x1="140" y1="328" x2="166" y2="326"/>
      <line x1="158" y1="330" x2="184" y2="328"/>
    </g>
  </g>
  <!-- the drawer, PENDING -->
  <rect x="60" y="342" width="70" height="60" fill="#0a0e17" stroke="#1c2739" stroke-width="1.4"/>
  <rect x="84" y="366" width="22" height="4" fill="#26334d"/>
  <text x="95" y="362" text-anchor="middle" font-family="Georgia, serif" font-size="7" letter-spacing="1.5" fill="#5c6678">PENDING</text>

  <!-- office chair, empty, pushed from the desk -->
  <g fill="#05070c">
    <path d="M246 268 q18 -6 34 0 l-2 52 h-30 Z"/>
    <rect x="242" y="318" width="44" height="9"/>
    <rect x="250" y="327" width="7" height="46"/>
    <rect x="272" y="327" width="7" height="40"/>
  </g>
  <path d="M246 268 q18 -6 34 0" fill="none" stroke="#29e6d2" stroke-width="1" opacity="0.4"/>

  <!-- motes in the lamp cone -->
  <g fill="#ffb347">
    <circle cx="88" cy="300" r="1" opacity="0.6"/><circle cx="108" cy="284" r="0.8" opacity="0.45"/>
    <circle cx="52" cy="310" r="0.9" opacity="0.5"/>
  </g>

  <rect width="300" height="450" filter="url(#irgrain)" opacity="0.5" fill="none"/>

  <rect x="6" y="6" width="288" height="438" fill="none" stroke="#37476b" stroke-width="1.6"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#232f45" stroke-width="0.8"/>
  <g stroke="#ffb347" stroke-width="1.6">
    <line x1="6" y1="18" x2="6" y2="6"/><line x1="6" y1="6" x2="18" y2="6"/>
    <line x1="282" y1="6" x2="294" y2="6"/><line x1="294" y1="6" x2="294" y2="18"/>
    <line x1="6" y1="432" x2="6" y2="444"/><line x1="6" y1="444" x2="18" y2="444"/>
    <line x1="282" y1="444" x2="294" y2="444"/><line x1="294" y1="444" x2="294" y2="432"/>
  </g>

  <rect x="24" y="398" width="252" height="30" fill="#070b11" opacity="0.9"/>
  <line x1="24" y1="398" x2="276" y2="398" stroke="#ffb347" stroke-width="0.8"/>
  <text x="150" y="417" text-anchor="middle" font-family="Georgia, serif" font-size="11.5" letter-spacing="2.2" fill="#d8d2c4">THREE LETTERS, SAME HAND</text>
</svg>
