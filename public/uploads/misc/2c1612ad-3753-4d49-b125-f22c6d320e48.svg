<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="owall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080b11"/>
      <stop offset="1" stop-color="#0d1422"/>
    </linearGradient>
    <radialGradient id="olamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffb347" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <filter id="ograin">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0.05 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#owall)"/>

  <!-- the big window: rain, city, the noodle-bar glow below -->
  <g>
    <rect x="640" y="40" width="520" height="320" fill="#0a1220" stroke="#1c2739" stroke-width="3"/>
    <line x1="900" y1="40" x2="900" y2="360" stroke="#1c2739" stroke-width="2.4"/>
    <line x1="640" y1="200" x2="1160" y2="200" stroke="#1c2739" stroke-width="2.4"/>
    <!-- city -->
    <g fill="#0c1626">
      <rect x="660" y="120" width="40" height="200"/><rect x="712" y="90" width="34" height="230"/>
      <rect x="756" y="130" width="44" height="190"/><rect x="920" y="100" width="38" height="220"/>
      <rect x="968" y="140" width="46" height="180"/><rect x="1024" y="112" width="36" height="208"/>
      <rect x="1070" y="150" width="60" height="170"/>
    </g>
    <g fill="#ffb347" opacity="0.45">
      <rect x="668" y="140" width="4" height="5"/><rect x="722" y="110" width="4" height="5"/><rect x="766" y="150" width="4" height="5"/>
      <rect x="928" y="120" width="4" height="5"/><rect x="978" y="160" width="4" height="5"/><rect x="1032" y="130" width="4" height="5"/>
      <rect x="1082" y="170" width="4" height="5"/>
    </g>
    <g fill="#29e6d2" opacity="0.35">
      <rect x="740" y="180" width="4" height="5"/><rect x="1000" y="200" width="4" height="5"/>
    </g>
    <!-- noodle-bar glow, street level -->
    <ellipse cx="760" cy="352" rx="90" ry="22" fill="#ffb347" opacity="0.18"/>
    <rect x="716" y="340" width="88" height="20" fill="#ffb347" opacity="0.22"/>
    <!-- rain past the glass -->
    <g stroke="#7f93b8" stroke-width="0.9" opacity="0.32">
      <line x1="672" y1="50" x2="656" y2="120"/><line x1="710" y1="70" x2="694" y2="140"/>
      <line x1="790" y1="56" x2="774" y2="126"/><line x1="848" y1="90" x2="832" y2="160"/>
      <line x1="930" y1="220" x2="914" y2="290"/><line x1="1010" y1="230" x2="994" y2="300"/>
      <line x1="1080" y1="216" x2="1064" y2="286"/><line x1="1130" y1="250" x2="1114" y2="320"/>
    </g>
  </g>

  <!-- desk: foreground left -->
  <rect x="0" y="300" width="620" height="14" fill="#0b1119"/>
  <line x1="0" y1="300" x2="620" y2="300" stroke="#26334d" stroke-width="1.6"/>
  <!-- the lamp -->
  <line x1="210" y1="300" x2="210" y2="196" stroke="#37476b" stroke-width="2.4"/>
  <path d="M178 196 h64 l16 20 h-96 Z" fill="#0b1119" stroke="#ffb347" stroke-width="2"/>
  <circle cx="210" cy="228" r="5" fill="#ffb347"/>
  <circle cx="210" cy="228" r="70" fill="url(#olamp)"/>
  <path d="M210 234 L110 460 L330 460 Z" fill="#ffb347" opacity="0.06"/>
  <!-- papers on the desk -->
  <g fill="#cfc9b8" opacity="0.8">
    <polygon points="300,300 360,292 372,300 312,308"/>
    <polygon points="330,300 388,296 396,304 338,308"/>
  </g>
  <!-- the drawer, PENDING -->
  <rect x="60" y="314" width="110" height="86" fill="#0a0e17" stroke="#1c2739" stroke-width="1.6"/>
  <rect x="96" y="350" width="34" height="6" fill="#26334d"/>
  <text x="115" y="344" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="2.5" fill="#5c6678">PENDING</text>
  <!-- mug + pen -->
  <rect x="470" y="284" width="16" height="16" fill="#101828" stroke="#26334d"/>
  <line x1="498" y1="286" x2="520" y2="298" stroke="#26334d" stroke-width="2"/>

  <!-- office chair, right, empty -->
  <g fill="#05070c">
    <path d="M544 240 q20 -7 38 0 l-2 60 h-34 Z"/>
    <rect x="538" y="298" width="50" height="10"/>
    <rect x="548" y="308" width="8" height="66"/>
    <rect x="574" y="308" width="8" height="58"/>
  </g>
  <path d="M544 240 q20 -7 38 0" fill="none" stroke="#29e6d2" stroke-width="1.2" opacity="0.4"/>

  <!-- motes in the lamp cone -->
  <g fill="#ffb347">
    <circle cx="240" cy="270" r="1.4" opacity="0.6"/><circle cx="266" cy="248" r="1.1" opacity="0.45"/>
    <circle cx="150" cy="288" r="1.2" opacity="0.5"/>
  </g>

  <rect width="1200" height="400" filter="url(#ograin)" opacity="0.5" fill="none"/>
</svg>
