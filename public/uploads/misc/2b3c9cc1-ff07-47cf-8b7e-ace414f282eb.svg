<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="oss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08090d"/>
      <stop offset="1" stop-color="#0f0e13"/>
    </linearGradient>
    <radialGradient id="ocandle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d98a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ogleam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="ograin3">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0.055 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#oss)"/>

  <!-- the wide niche wall -->
  <g fill="none" stroke="#1c2230" stroke-width="1.5">
    <!-- band 1 -->
    <rect x="40" y="60" width="130" height="60"/><rect x="186" y="60" width="130" height="60"/>
    <rect x="332" y="60" width="130" height="60"/><rect x="478" y="60" width="130" height="60"/>
    <rect x="624" y="60" width="130" height="60"/><rect x="770" y="60" width="130" height="60"/>
    <rect x="916" y="60" width="130" height="60"/><rect x="1062" y="60" width="98" height="60"/>
  </g>
  <g stroke="#3d4658" stroke-width="1.1" opacity="0.6">
    <line x1="56" y1="90" x2="120" y2="90"/><line x1="64" y1="98" x2="112" y2="98"/>
    <line x1="202" y1="90" x2="266" y2="90"/>
    <line x1="348" y1="90" x2="412" y2="90"/><line x1="356" y1="98" x2="404" y2="98"/>
    <line x1="494" y1="90" x2="558" y2="90"/>
    <line x1="640" y1="90" x2="704" y2="90"/><line x1="648" y1="98" x2="696" y2="98"/>
    <line x1="786" y1="90" x2="850" y2="90"/>
    <line x1="932" y1="90" x2="996" y2="90"/><line x1="940" y1="98" x2="988" y2="98"/>
  </g>
  <!-- band 2 -->
  <g fill="none" stroke="#1c2230" stroke-width="1.5">
    <rect x="60" y="150" width="150" height="72"/><rect x="228" y="150" width="150" height="72"/>
    <rect x="396" y="150" width="150" height="72"/><rect x="564" y="150" width="150" height="72"/>
    <rect x="732" y="150" width="150" height="72"/><rect x="900" y="150" width="150" height="72"/>
  </g>
  <g stroke="#3d4658" stroke-width="1.2" opacity="0.65">
    <line x1="80" y1="186" x2="150" y2="186"/><line x1="88" y1="194" x2="142" y2="194"/>
    <line x1="248" y1="186" x2="318" y2="186"/>
    <line x1="416" y1="186" x2="486" y2="186"/><line x1="424" y1="194" x2="478" y2="194"/>
    <line x1="584" y1="186" x2="654" y2="186"/>
    <line x1="752" y1="186" x2="822" y2="186"/><line x1="760" y1="194" x2="814" y2="194"/>
    <line x1="920" y1="186" x2="990" y2="186"/>
  </g>
  <!-- band 2: THE BLANK PLATE, second from right -->
  <rect x="736" y="154" width="142" height="64" fill="url(#ogleam)"/>
  <rect x="736" y="154" width="142" height="64" fill="none" stroke="#ffb347" stroke-width="1.2" opacity="0.75"/>
  <path d="M748 164 L788 204" stroke="#ffdf9e" stroke-width="1.2" opacity="0.5"/>
  <!-- band 3 (near, taller, darker) -->
  <g fill="none" stroke="#181d2a" stroke-width="1.7">
    <rect x="30" y="252" width="170" height="90"/><rect x="220" y="252" width="170" height="90"/>
    <rect x="410" y="252" width="170" height="90"/><rect x="600" y="252" width="170" height="90"/>
    <rect x="790" y="252" width="170" height="90"/><rect x="980" y="252" width="170" height="90"/>
  </g>
  <g stroke="#2e3648" stroke-width="1.2" opacity="0.5">
    <line x1="46" y1="296" x2="130" y2="296"/><line x1="236" y1="296" x2="320" y2="296"/>
    <line x1="426" y1="296" x2="510" y2="296"/><line x1="616" y1="296" x2="700" y2="296"/>
    <line x1="806" y1="296" x2="890" y2="296"/><line x1="996" y1="296" x2="1080" y2="296"/>
  </g>

  <!-- floor -->
  <rect x="0" y="342" width="1200" height="58" fill="#0a0a10"/>
  <line x1="0" y1="342" x2="1200" y2="342" stroke="#1c2230" stroke-width="1.6"/>

  <!-- candle row: three stubs on a ledge, foreground left -->
  <ellipse cx="150" cy="352" rx="180" ry="30" fill="url(#ocandle)"/>
  <g>
    <rect x="96" y="322" width="12" height="22" fill="#d8d2c4" opacity="0.9"/>
    <path d="M102 312 q6 8 3 13 q-3 4 -6 0 q-3 -7 3 -13 Z" fill="#ffb347"/>
    <rect x="124" y="316" width="11" height="28" fill="#d8d2c4" opacity="0.85"/>
    <path d="M129 306 q5 7 2 12 q-2 4 -5 0 q-3 -6 3 -12 Z" fill="#ffdf9e"/>
    <rect x="152" y="326" width="10" height="18" fill="#d8d2c4" opacity="0.8"/>
  </g>
  <!-- warm pool + cast shadows -->
  <ellipse cx="130" cy="356" rx="110" ry="14" fill="#ffb347" opacity="0.08"/>
  <g stroke="#05050a" stroke-width="9" opacity="0.65">
    <line x1="110" y1="340" x2="30" y2="392"/>
    <line x1="134" y1="344" x2="90" y2="398"/>
  </g>
  <!-- their reflections -->
  <rect x="97" y="356" width="12" height="20" fill="#d8d2c4" opacity="0.2"/>
  <rect x="125" y="356" width="11" height="24" fill="#d8d2c4" opacity="0.18"/>

  <rect width="1200" height="400" filter="url(#ograin3)" opacity="0.55" fill="none"/>
</svg>
