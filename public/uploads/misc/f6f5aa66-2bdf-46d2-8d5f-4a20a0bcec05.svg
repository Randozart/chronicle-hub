<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="600" height="900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1119"/>
      <stop offset="0.55" stop-color="#101a28"/>
      <stop offset="1" stop-color="#0d1725"/>
    </linearGradient>
    <linearGradient id="water2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173244"/>
      <stop offset="1" stop-color="#0a1420"/>
    </linearGradient>
    <linearGradient id="blindband" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d5878" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3d5878" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="lamp2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffb347" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <pattern id="halftone" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.9" fill="#060a12"/>
    </pattern>
    <pattern id="halftoneBig" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="1.4" fill="#060a12"/>
    </pattern>
    <filter id="grain3">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0.06 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="300" height="450" fill="url(#wall)"/>

  <!-- ======== BACKGROUND: the window with blinds, upper left ======== -->
  <g>
    <rect x="22" y="52" width="128" height="126" fill="#16283c"/>
    <!-- city beyond, faint -->
    <g fill="#0e1a2a">
      <rect x="30" y="96" width="18" height="80"/><rect x="54" y="82" width="14" height="94"/>
      <rect x="74" y="102" width="20" height="74"/><rect x="100" y="88" width="16" height="88"/>
      <rect x="122" y="106" width="20" height="70"/>
    </g>
    <g fill="#d8a54a" opacity="0.5">
      <rect x="34" y="104" width="2.5" height="3.5"/><rect x="58" y="92" width="2.5" height="3.5"/>
      <rect x="80" y="112" width="2.5" height="3.5"/><rect x="106" y="98" width="2.5" height="3.5"/>
    </g>
    <!-- blind slats -->
    <g fill="#0a0e14" opacity="0.85">
      <rect x="22" y="60" width="128" height="7"/><rect x="22" y="76" width="128" height="7"/>
      <rect x="22" y="92" width="128" height="7"/><rect x="22" y="108" width="128" height="7"/>
      <rect x="22" y="124" width="128" height="7"/><rect x="22" y="140" width="128" height="7"/>
      <rect x="22" y="156" width="128" height="7"/><rect x="22" y="170" width="128" height="8"/>
    </g>
    <rect x="22" y="52" width="128" height="126" fill="none" stroke="#26334d" stroke-width="2"/>
    <line x1="86" y1="52" x2="86" y2="178" stroke="#26334d" stroke-width="1.4"/>
  </g>

  <!-- ======== BLIND LIGHT raking across the wall, down-right ======== -->
  <g opacity="0.6">
    <polygon points="150,66 294,30 294,150 150,196" fill="url(#blindband)"/>
    <!-- slat shadows inside the band -->
    <g fill="#0a0e14" opacity="0.5">
      <polygon points="158,74 294,42 294,50 158,83"/>
      <polygon points="160,90 294,60 294,68 160,99"/>
      <polygon points="162,106 294,78 294,86 162,115"/>
      <polygon points="164,122 294,96 294,104 164,131"/>
      <polygon points="166,138 294,114 294,122 166,147"/>
      <polygon points="168,154 294,132 294,140 168,163"/>
      <polygon points="170,170 294,150 294,158 170,179"/>
    </g>
  </g>
  <!-- halftone in the lit band shadow-side -->
  <polygon points="150,196 294,150 294,214 150,262" fill="url(#halftone)" opacity="0.35"/>

  <!-- ======== MIDGROUND: stairs behind the chair, descending into water ======== -->
  <g>
    <path d="M196 208 H240 V228 H262 V248 H284 V268 H300 V338 H196 Z" fill="#0a1019" stroke="#22304a" stroke-width="1.3"/>
    <g stroke="#5b7396" stroke-width="1" opacity="0.5">
      <line x1="240" y1="208" x2="240" y2="228"/><line x1="262" y1="228" x2="262" y2="248"/>
      <line x1="284" y1="248" x2="284" y2="268"/>
      <line x1="196" y1="208" x2="240" y2="208"/><line x1="240" y1="228" x2="262" y2="228"/>
      <line x1="262" y1="248" x2="284" y2="248"/><line x1="284" y1="268" x2="300" y2="268"/>
    </g>
  </g>

  <!-- hanging lamp, small secondary -->
  <line x1="242" y1="54" x2="242" y2="96" stroke="#37476b" stroke-width="1.3"/>
  <path d="M230 96 h24 l6 10 h-36 Z" fill="#0b1119" stroke="#ffb347" stroke-width="1.3"/>
  <circle cx="242" cy="112" r="2.8" fill="#ffb347"/>
  <circle cx="242" cy="112" r="30" fill="url(#lamp2)"/>
  <path d="M242 116 L204 338 L282 338 Z" fill="#ffb347" opacity="0.04"/>

  <!-- ======== WATER ======== -->
  <rect x="0" y="330" width="300" height="120" fill="url(#water2)"/>
  <!-- blind light streaks on water -->
  <g fill="#3d5878" opacity="0.3">
    <polygon points="120,336 210,336 200,344 112,344"/>
    <polygon points="96,352 250,352 240,360 88,360"/>
    <polygon points="60,372 262,372 254,382 52,382"/>
  </g>
  <g stroke="#29e6d2" stroke-width="0.8" opacity="0.4">
    <line x1="26" y1="366" x2="84" y2="366"/>
    <line x1="270" y1="356" x2="298" y2="356"/>
    <line x1="40" y1="400" x2="130" y2="400"/>
    <line x1="200" y1="414" x2="292" y2="414"/>
    <line x1="20" y1="430" x2="96" y2="430"/>
  </g>

  <!-- ======== FOREGROUND: the client, seated, water at his knees ======== -->
  <!-- chair back: top edge peeks above the hat -->
  <path d="M88 236 q54 -10 108 0 l-2 82 h-104 Z" fill="#0a0d16"/>
  <path d="M88 236 q54 -10 108 0" fill="none" stroke="#31415f" stroke-width="1.2" opacity="0.8"/>

  <!-- figure, angular -->
  <g fill="#03050a">
    <!-- torso: hard shoulder corners, neck slope -->
    <path d="M96 264 L126 250 L160 250 L190 264 L193 318 L93 318 Z"/>
    <!-- arms: wedges out to the armrests -->
    <path d="M100 268 L86 298 L110 302 L114 274 Z"/>
    <path d="M186 268 L200 298 L176 302 L172 274 Z"/>
    <!-- hat: distinct fill so it separates from the body -->
    <g fill="#0e1626">
      <path d="M127 200 L159 200 L163 226 L123 226 Z"/>
      <path d="M141 200 q6 -4 12 0 l1 3 h-14 Z" fill="#0e1626"/>
      <path d="M114 226 L172 226 L176 235 L110 235 Z"/>
    </g>
    <!-- face shadow under brim -->
    <rect x="131" y="235" width="24" height="14"/>
  </g>
  <!-- brim throws its shadow down -->
  <rect x="112" y="235" width="62" height="4" fill="#000205" opacity="0.85"/>
  <line x1="110" y1="235" x2="176" y2="235" stroke="#5b7396" stroke-width="0.8" opacity="0.5"/>

  <!-- armrests in front of forearms -->
  <g>
    <rect x="78" y="292" width="28" height="9" fill="#0a0d14"/>
    <rect x="180" y="292" width="28" height="9" fill="#0a0d14"/>
    <line x1="78" y1="292" x2="106" y2="292" stroke="#ffb347" stroke-width="1" opacity="0.5"/>
    <line x1="180" y1="292" x2="208" y2="292" stroke="#29e6d2" stroke-width="1" opacity="0.45"/>
  </g>

  <!-- rim light, following the new contours -->
  <path d="M127 200 L159 200" fill="none" stroke="#ffb347" stroke-width="1.6" opacity="0.95"/>
  <path d="M127 200 L123 226" fill="none" stroke="#ffb347" stroke-width="1.1" opacity="0.7"/>
  <path d="M114 226 L110 235" fill="none" stroke="#ffb347" stroke-width="1.2" opacity="0.8"/>
  <path d="M96 264 L126 250" fill="none" stroke="#ffb347" stroke-width="1.5" opacity="0.9"/>
  <path d="M159 200 L163 226" fill="none" stroke="#29e6d2" stroke-width="1" opacity="0.65"/>
  <path d="M172 226 L176 235" fill="none" stroke="#29e6d2" stroke-width="1" opacity="0.6"/>
  <path d="M190 264 L160 250" fill="none" stroke="#29e6d2" stroke-width="1.3" opacity="0.8"/>
  <!-- halftone on the right of the torso -->
  <path d="M160 252 L190 264 L193 316 L150 316 Z" fill="url(#halftone)" opacity="0.55"/>
  <!-- lap: knees under water -->
  <path d="M112 318 h60" stroke="#04060b" stroke-width="7" opacity="0.85"/>

  <!-- chair seat -->
  <rect x="90" y="316" width="104" height="11" fill="#07090f"/>
  <rect x="97" y="327" width="9" height="27" fill="#07090f"/>
  <rect x="178" y="327" width="9" height="21" fill="#07090f"/>
  <!-- waterline crossing legs -->
  <line x1="70" y1="338" x2="248" y2="338" stroke="#29e6d2" stroke-width="1.2" opacity="0.7"/>
  <path d="M97 344 h20 M178 342 h14" stroke="#29e6d2" stroke-width="0.8" opacity="0.5"/>
  <!-- chair reflection -->
  <g fill="#04060b" opacity="0.55">
    <path d="M96 344 q48 8 92 0 l-4 22 q-42 8 -84 0 Z"/>
  </g>
  <g stroke="#22304a" stroke-width="1.6" opacity="0.6">
    <line x1="102" y1="376" x2="102" y2="394"/>
    <line x1="182" y1="372" x2="182" y2="388"/>
  </g>

  <!-- foreground column, left framing -->
  <path d="M0 0 H34 V450 H0 Z" fill="#05070c"/>
  <path d="M34 0 V450" stroke="#1c2739" stroke-width="1.6"/>
  <polygon points="0,180 34,196 34,320 0,336" fill="url(#halftoneBig)" opacity="0.4"/>

  <!-- drifting rain past the window light -->
  <g stroke="#7f93b8" stroke-width="0.7" opacity="0.25">
    <line x1="60" y1="30" x2="48" y2="74"/><line x1="180" y1="26" x2="168" y2="70"/>
    <line x1="272" y1="180" x2="260" y2="224"/><line x1="60" y1="200" x2="48" y2="244"/>
    <line x1="270" y1="250" x2="258" y2="294"/>
  </g>

  <!-- vignette + grain -->
  <rect width="300" height="450" fill="none" filter="url(#grain3)" opacity="0.55"/>
  <rect width="300" height="80" fill="#05070c" opacity="0.25"/>

  <!-- letterbox frame -->
  <rect x="6" y="6" width="288" height="438" fill="none" stroke="#37476b" stroke-width="1.6"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#232f45" stroke-width="0.8"/>
  <g stroke="#ffb347" stroke-width="1.6">
    <line x1="6" y1="18" x2="6" y2="6"/><line x1="6" y1="6" x2="18" y2="6"/>
    <line x1="282" y1="6" x2="294" y2="6"/><line x1="294" y1="6" x2="294" y2="18"/>
    <line x1="6" y1="432" x2="6" y2="444"/><line x1="6" y1="444" x2="18" y2="444"/>
    <line x1="282" y1="444" x2="294" y2="444"/><line x1="294" y1="444" x2="294" y2="432"/>
  </g>

  <!-- title band -->
  <rect x="24" y="398" width="252" height="30" fill="#070b11" opacity="0.9"/>
  <line x1="24" y1="398" x2="276" y2="398" stroke="#ffb347" stroke-width="0.8"/>
  <text x="150" y="417" text-anchor="middle" font-family="Georgia, serif" font-size="11.5" letter-spacing="2.5" fill="#d8d2c4">THE MAN IN THE CLIENT CHAIR</text>
</svg>
