<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="lsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="0.52" stop-color="#0f1d2e"/>
      <stop offset="0.6" stop-color="#14293c"/>
      <stop offset="1" stop-color="#0b1520"/>
    </linearGradient>
    <radialGradient id="ldisc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8d2c4" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#d8d2c4" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d8d2c4" stop-opacity="0"/>
    </radialGradient>
    <filter id="lgrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0.045 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#lsky)"/>

  <!-- the pale disc, high -->
  <circle cx="880" cy="90" r="70" fill="url(#ldisc)"/>
  <circle cx="880" cy="90" r="30" fill="#d8d2c4" opacity="0.15"/>
  <circle cx="880" cy="90" r="30" fill="none" stroke="#d8d2c4" stroke-width="0.8" opacity="0.3"/>

  <!-- doors standing on the water, a crooked little street of them -->
  <g>
    <rect x="90" y="196" width="34" height="74" fill="#070b11" stroke="#37476b" stroke-width="1.6"/>
    <line x1="116" y1="232" x2="116" y2="256" stroke="#ffb347" stroke-width="1.6" opacity="0.9"/>
    <rect x="210" y="180" width="30" height="90" fill="#070b11" stroke="#37476b" stroke-width="1.6"/>
    <rect x="215" y="186" width="20" height="78" fill="none" stroke="#232f45" stroke-width="0.8"/>
    <line x1="234" y1="222" x2="234" y2="252" stroke="#ffb347" stroke-width="1.4" opacity="0.7"/>
    <rect x="330" y="204" width="30" height="66" fill="#070b11" stroke="#37476b" stroke-width="1.6"/>
    <line x1="354" y1="234" x2="354" y2="258" stroke="#ffb347" stroke-width="1.4" opacity="0.75"/>
    <rect x="452" y="188" width="32" height="82" fill="#070b11" stroke="#37476b" stroke-width="1.6"/>
    <path d="M452 188 h32 v10 h-32 Z" fill="#0b1119"/>
  </g>
  <!-- their reflections -->
  <g opacity="0.4">
    <rect x="92" y="272" width="30" height="46" fill="#0b1119" stroke="#22304a" stroke-width="1"/>
    <rect x="212" y="272" width="26" height="56" fill="#0b1119" stroke="#22304a" stroke-width="1"/>
    <rect x="332" y="272" width="26" height="40" fill="#0b1119" stroke="#22304a" stroke-width="1"/>
    <rect x="454" y="272" width="28" height="50" fill="#0b1119" stroke="#22304a" stroke-width="1"/>
  </g>

  <!-- horizon + the water that isn't -->
  <line x1="0" y1="270" x2="1200" y2="270" stroke="#29e6d2" stroke-width="0.9" opacity="0.45"/>
  <rect x="0" y="270" width="1200" height="130" fill="#0b1520"/>
  <g stroke="#29e6d2" stroke-width="0.8" opacity="0.3">
    <line x1="30" y1="296" x2="180" y2="296"/><line x1="260" y1="320" x2="430" y2="320"/>
    <line x1="500" y1="348" x2="700" y2="348"/><line x1="760" y1="310" x2="960" y2="310"/>
    <line x1="900" y1="376" x2="1120" y2="376"/>
  </g>

  <!-- lamps along the waterline: the lamplighter's rounds, kept -->
  <g stroke="#2a3a58" stroke-width="2.2">
    <line x1="140" y1="270" x2="140" y2="196"/><line x1="520" y1="270" x2="520" y2="200"/><line x1="1020" y1="270" x2="1020" y2="200"/>
  </g>
  <g>
    <path d="M128 196 h24 l6 9 h-36 Z" fill="#0b1119" stroke="#ffb347" stroke-width="1.3"/>
    <circle cx="140" cy="210" r="2.8" fill="#ffb347"/>
    <path d="M508 200 h24 l6 9 h-36 Z" fill="#0b1119" stroke="#ffb347" stroke-width="1.3"/>
    <circle cx="520" cy="214" r="2.8" fill="#ffb347"/>
    <path d="M1008 200 h24 l6 9 h-36 Z" fill="#0b1119" stroke="#ffb347" stroke-width="1.3"/>
    <circle cx="1020" cy="214" r="2.8" fill="#ffb347"/>
  </g>
  <g fill="#ffb347" opacity="0.2">
    <circle cx="140" cy="210" r="22"/><circle cx="520" cy="214" r="22"/><circle cx="1020" cy="214" r="22"/>
  </g>
  <!-- lamp reflections -->
  <g stroke="#ffb347" stroke-width="1.6" opacity="0.4">
    <line x1="140" y1="272" x2="140" y2="330"/><line x1="520" y1="272" x2="520" y2="336"/><line x1="1020" y1="272" x2="1020" y2="330"/>
  </g>

  <!-- the postbox, bolted to nothing -->
  <g>
    <rect x="640" y="216" width="34" height="56" fill="#0b1119" stroke="#37476b" stroke-width="1.6"/>
    <path d="M640 216 h34 l-4 -10 h-26 Z" fill="#0b1119" stroke="#37476b" stroke-width="1.4"/>
    <rect x="648" y="228" width="18" height="4" fill="#26334d"/>
    <line x1="657" y1="216" x2="657" y2="272" stroke="#ff2d78" stroke-width="1" opacity="0.5"/>
    <rect x="649" y="244" width="20" height="28" fill="#0b1119"/>
  </g>
  <rect x="644" y="272" width="26" height="30" fill="#0b1119" opacity="0.4"/>

  <!-- supper bells implied: warm windows lit for dinner, far -->
  <g fill="#ffb347" opacity="0.45">
    <rect x="720" y="238" width="8" height="10"/><rect x="756" y="242" width="6" height="8"/>
    <rect x="1088" y="240" width="8" height="10"/>
  </g>

  <!-- motes -->
  <g fill="#ffb347">
    <circle cx="320" cy="180" r="1.1" opacity="0.6"/><circle cx="586" cy="160" r="0.9" opacity="0.5"/>
    <circle cx="742" cy="180" r="1" opacity="0.5"/><circle cx="960" cy="200" r="0.9" opacity="0.45"/>
  </g>

  <rect width="1200" height="400" filter="url(#lgrain)" opacity="0.5" fill="none"/>
</svg>
