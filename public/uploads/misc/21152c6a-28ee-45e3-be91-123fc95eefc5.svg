<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="hsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a10"/>
      <stop offset="1" stop-color="#0e1828"/>
    </linearGradient>
    <filter id="hgrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0.05 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#hsky)"/>

  <!-- looking up: towers leaning inward -->
  <g fill="#0c1524">
    <polygon points="-20,400 220,0 380,0 220,400"/>
    <polygon points="880,0 1220,0 1080,400 900,400"/>
  </g>
  <g fill="#0a0e14">
    <polygon points="240,400 340,0 440,0 360,400"/>
    <polygon points="760,0 850,0 800,400 720,400"/>
  </g>
  <!-- tower windows, scattered -->
  <g fill="#ffb347" opacity="0.5">
    <rect x="90" y="320" width="6" height="8" transform="skewY(-30)"/><rect x="130" y="250" width="6" height="8" transform="skewY(-30)"/>
    <rect x="290" y="200" width="6" height="8" transform="skewY(-25)"/><rect x="306" y="130" width="6" height="8" transform="skewY(-25)"/>
    <rect x="790" y="180" width="6" height="8" transform="skewY(25)"/><rect x="806" y="260" width="6" height="8" transform="skewY(25)"/>
    <rect x="960" y="300" width="6" height="8" transform="skewY(28)"/><rect x="1000" y="230" width="6" height="8" transform="skewY(28)"/>
  </g>
  <g fill="#29e6d2" opacity="0.4">
    <rect x="298" y="240" width="6" height="8" transform="skewY(-25)"/>
    <rect x="974" y="340" width="6" height="8" transform="skewY(28)"/>
  </g>

  <!-- sky gap: drizzle + one lit window crane-high -->
  <g stroke="#7f93b8" stroke-width="1" opacity="0.35">
    <line x1="480" y1="20" x2="456" y2="100"/><line x1="530" y1="60" x2="506" y2="140"/>
    <line x1="600" y1="30" x2="576" y2="110"/><line x1="650" y1="80" x2="626" y2="160"/>
    <line x1="700" y1="20" x2="676" y2="100"/><line x1="560" y1="150" x2="536" y2="230"/>
    <line x1="660" y1="190" x2="636" y2="270"/><line x1="500" y1="240" x2="476" y2="320"/>
  </g>
  <rect x="576" y="90" width="12" height="16" fill="#ffb347" opacity="0.6"/>
  <rect x="573" y="87" width="18" height="22" fill="none" stroke="#26334d" stroke-width="1.4"/>

  <!-- lobby glass at street level -->
  <rect x="0" y="330" width="1200" height="70" fill="#0b1119"/>
  <rect x="90" y="318" width="1020" height="52" fill="#0e1828" stroke="#26334d" stroke-width="2"/>
  <g stroke="#1c2739" stroke-width="2">
    <line x1="260" y1="318" x2="260" y2="370"/><line x1="430" y1="318" x2="430" y2="370"/>
    <line x1="600" y1="318" x2="600" y2="370"/><line x1="770" y1="318" x2="770" y2="370"/><line x1="940" y1="318" x2="940" y2="370"/>
  </g>
  <!-- warm lobby light between mullions -->
  <g fill="#ffb347" opacity="0.12">
    <rect x="264" y="318" width="162" height="52"/><rect x="604" y="318" width="162" height="52"/>
  </g>
  <!-- the desk, one lamp inside -->
  <circle cx="520" cy="344" r="5" fill="#ffb347"/>
  <circle cx="520" cy="344" r="24" fill="#ffb347" opacity="0.18"/>

  <!-- drizzle over everything -->
  <g stroke="#7f93b8" stroke-width="0.9" opacity="0.3">
    <line x1="200" y1="10" x2="180" y2="80"/><line x1="420" y1="40" x2="400" y2="110"/>
    <line x1="640" y1="240" x2="620" y2="310"/><line x1="860" y1="10" x2="840" y2="80"/>
    <line x1="1060" y1="260" x2="1040" y2="330"/><line x1="380" y1="150" x2="360" y2="220"/>
  </g>

  <rect width="1200" height="400" filter="url(#hgrain)" opacity="0.5" fill="none"/>
</svg>
