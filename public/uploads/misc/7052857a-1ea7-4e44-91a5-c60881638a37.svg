<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="600" height="900">
  <defs>
    <linearGradient id="bsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="0.45" stop-color="#0e1826"/>
      <stop offset="0.6" stop-color="#132435"/>
      <stop offset="1" stop-color="#0c1723"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8d2c4" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#d8d2c4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d8d2c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bwater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14263a"/>
      <stop offset="1" stop-color="#0a1420"/>
    </linearGradient>
    <radialGradient id="lampbloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.75"/>
      <stop offset="0.4" stop-color="#ffb347" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <filter id="bgrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0.05 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="wglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <rect width="300" height="450" fill="url(#bsky)"/>

  <!-- the pale disc -->
  <circle cx="222" cy="112" r="58" fill="url(#disc)"/>
  <circle cx="222" cy="112" r="27" fill="#d8d2c4" opacity="0.16"/>
  <circle cx="222" cy="112" r="27" fill="none" stroke="#d8d2c4" stroke-width="0.8" opacity="0.35"/>

  <!-- motes -->
  <g fill="#ffb347">
    <circle cx="66" cy="140" r="1.1" opacity="0.7"/><circle cx="128" cy="168" r="0.9" opacity="0.5"/>
    <circle cx="252" cy="176" r="1" opacity="0.55"/><circle cx="180" cy="136" r="0.8" opacity="0.45"/>
    <circle cx="42" cy="188" r="0.9" opacity="0.5"/><circle cx="286" cy="144" r="0.8" opacity="0.4"/>
    <circle cx="96" cy="206" r="0.8" opacity="0.4"/>
  </g>

  <!-- floating windows, some with plants -->
  <g>
    <rect x="24" y="228" width="14" height="18" fill="none" stroke="#26334d" stroke-width="1.2"/>
    <rect x="27" y="231" width="8" height="12" fill="#ffb347" opacity="0.5" filter="url(#wglow)"/>
    <path d="M31 231 v-4 M29 228 q2 -3 4 0" stroke="#4d7a68" stroke-width="1" fill="none"/>
    <rect x="88" y="214" width="12" height="15" fill="none" stroke="#26334d" stroke-width="1.2"/>
    <rect x="90.5" y="217" width="7" height="10" fill="#ffb347" opacity="0.32"/>
    <rect x="262" y="222" width="14" height="18" fill="none" stroke="#26334d" stroke-width="1.2"/>
    <rect x="265" y="225" width="8" height="12" fill="#ffb347" opacity="0.42" filter="url(#wglow)"/>
    <path d="M269 225 v-5 M267 221 q2.5 -3.5 5 0" stroke="#4d7a68" stroke-width="1" fill="none"/>
  </g>

  <!-- horizon -->
  <line x1="0" y1="258" x2="300" y2="258" stroke="#29e6d2" stroke-width="0.9" opacity="0.45"/>

  <!-- the water that isn't -->
  <rect x="0" y="258" width="300" height="192" fill="url(#bwater)"/>
  <g stroke="#29e6d2" stroke-width="0.7" opacity="0.32">
    <line x1="16" y1="282" x2="120" y2="282"/>
    <line x1="176" y1="296" x2="288" y2="296"/>
    <line x1="54" y1="322" x2="196" y2="322"/>
    <line x1="110" y1="352" x2="252" y2="352"/>
  </g>

  <!-- the door, ajar, spilling warm light -->
  <g>
    <rect x="34" y="186" width="30" height="72" fill="#070b11" stroke="#37476b" stroke-width="1.4"/>
    <!-- the open leaf, swung toward us -->
    <path d="M64 186 L86 178 L86 252 L64 258 Z" fill="#0b1119" stroke="#26334d" stroke-width="1.2"/>
    <!-- warm spill through the gap -->
    <polygon points="36,192 64,186 64,258 36,258" fill="#ffb347" opacity="0.18"/>
    <line x1="61" y1="190" x2="61" y2="254" stroke="#ffb347" stroke-width="1.8" opacity="0.85"/>
    <polygon points="64,196 130,206 130,258 64,258" fill="#ffb347" opacity="0.08"/>
  </g>
  <!-- door reflection -->
  <g opacity="0.35">
    <rect x="36" y="262" width="28" height="48" fill="#0b1119" stroke="#22304a" stroke-width="1"/>
    <line x1="61" y1="266" x2="61" y2="304" stroke="#ffb347" stroke-width="1.6" opacity="0.5"/>
  </g>

  <!-- ======== THE LAMPLIGHTER, mid-light ======== -->
  <!-- walkway tongue from the left -->
  <path d="M0 386 H118 V394 H0 Z" fill="#0b1119"/>
  <line x1="0" y1="386" x2="118" y2="386" stroke="#37476b" stroke-width="1.2"/>
  <g transform="translate(26 0)">
  <!-- pole -->
  <line x1="86" y1="386" x2="86" y2="176" stroke="#2a3a58" stroke-width="2.4"/>
  <path d="M74 176 h24" stroke="#2a3a58" stroke-width="2.4"/>
  <!-- lamp head, just lit -->
  <path d="M76 168 h20 l5 9 h-30 Z" fill="#0b1119" stroke="#ffb347" stroke-width="1.4"/>
  <circle cx="86" cy="182" r="3" fill="#ffb347"/>
  <circle cx="86" cy="182" r="30" fill="url(#lampbloom)"/>
  <!-- the figure: reaching up, other hand in pocket -->
  <g fill="#04060b">
    <path d="M116 258 L94 214 L100 208 L122 250 Z"/>
    <circle cx="124" cy="242" r="7"/>
    <path d="M114 240 q10 -7 20 -1 l-2 4 q-8 -5 -16 1 Z"/>
    <path d="M112 252 q12 -8 24 0 l6 86 q-18 8 -36 0 Z"/>
    <path d="M132 262 q10 14 8 34 l-8 2 q-4 -18 -6 -32 Z"/>
    <rect x="114" y="336" width="9" height="50"/>
    <rect x="128" y="336" width="9" height="46"/>
  </g>
  <path d="M112 252 q12 -8 24 0" fill="none" stroke="#ffb347" stroke-width="1.4" opacity="0.9"/>
  <path d="M116 258 L96 216" fill="none" stroke="#ffb347" stroke-width="1.2" opacity="0.8"/>
  <path d="M136 254 l5 82" fill="none" stroke="#29e6d2" stroke-width="1.1" opacity="0.6"/>
  <path d="M131 244 q8 -3 12 2" fill="none" stroke="#29e6d2" stroke-width="0.9" opacity="0.5"/>
  <ellipse cx="126" cy="392" rx="26" ry="4" fill="#04060b" opacity="0.7"/>
  </g>

  <!-- ======== THE DOCK, RIGHT: two residents, one table ======== -->
  <path d="M164 372 H300 V450 H164 Z" fill="#0b1119"/>
  <path d="M164 372 H300 V378 H164 Z" fill="#111a28"/>
  <line x1="164" y1="372" x2="300" y2="372" stroke="#37476b" stroke-width="1.2"/>
  <g stroke="#16203a" stroke-width="1">
    <line x1="206" y1="378" x2="206" y2="450"/>
    <line x1="252" y1="378" x2="252" y2="450"/>
  </g>

  <!-- resident one: seated, facing right -->
  <g fill="#03050a">
    <path d="M182 306 q10 -14 22 -10 l4 40 h-28 Z"/>
    <circle cx="206" cy="290" r="6.5"/>
    <path d="M196 288 q10 -6 20 -1 l-2 4 q-8 -4 -16 1 Z"/>
    <path d="M206 312 q12 8 22 8 l0 6 q-14 0 -26 -8 Z"/>
    <rect x="188" y="336" width="7" height="36"/>
    <rect x="200" y="336" width="7" height="33"/>
  </g>
  <path d="M196 288 q10 -6 20 -1" fill="none" stroke="#ffb347" stroke-width="1" opacity="0.7"/>
  <!-- chair one -->
  <path d="M176 296 q10 -4 16 0 l-2 42 h-14 Z" fill="#04060b"/>
  <rect x="172" y="336" width="26" height="5" fill="#04060b"/>
  <rect x="174" y="341" width="5" height="31" fill="#04060b"/>

  <!-- resident two: seated, facing left -->
  <g fill="#03050a">
    <path d="M286 300 q-10 -12 -22 -8 l-2 42 h26 Z"/>
    <circle cx="262" cy="286" r="6.5"/>
    <path d="M252 284 q10 -6 20 0 l-2 4 q-8 -4 -16 0 Z"/>
    <path d="M262 308 q-12 8 -22 8 l0 6 q14 0 26 -8 Z"/>
    <rect x="272" y="336" width="7" height="36"/>
    <rect x="284" y="336" width="7" height="31"/>
  </g>
  <path d="M252 284 q10 -6 20 0" fill="none" stroke="#29e6d2" stroke-width="1" opacity="0.65"/>
  <!-- chair two -->
  <path d="M296 292 q10 -2 12 0 l0 46 h-14 Z" fill="#04060b"/>
  <rect x="278" y="336" width="26" height="5" fill="#04060b"/>
  <rect x="296" y="341" width="5" height="31" fill="#04060b"/>

  <!-- table between, one cup -->
  <rect x="222" y="346" width="26" height="4" fill="#0b1119" stroke="#26334d" stroke-width="1"/>
  <rect x="226" y="350" width="4" height="22" fill="#0b1119"/>
  <rect x="240" y="350" width="4" height="22" fill="#0b1119"/>
  <rect x="231" y="339" width="6" height="7" fill="#ffb347" opacity="0.55"/>
  <path d="M237 341 q4 1 0 3" stroke="#ffb347" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- grain + vignette -->
  <rect width="300" height="450" filter="url(#bgrain)" opacity="0.5" fill="none"/>
  <rect width="300" height="70" fill="#05070c" opacity="0.22"/>

  <!-- letterbox frame -->
  <rect x="6" y="6" width="288" height="438" fill="none" stroke="#37476b" stroke-width="1.6"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#232f45" stroke-width="0.8"/>
  <g stroke="#ffb347" stroke-width="1.6">
    <line x1="6" y1="18" x2="6" y2="6"/><line x1="6" y1="6" x2="18" y2="6"/>
    <line x1="282" y1="6" x2="294" y2="6"/><line x1="294" y1="6" x2="294" y2="18"/>
    <line x1="6" y1="432" x2="6" y2="444"/><line x1="6" y1="444" x2="18" y2="444"/>
    <line x1="282" y1="444" x2="294" y2="444"/><line x1="294" y1="444" x2="294" y2="432"/>
  </g>

  <!-- title band -->
  <rect x="24" y="398" width="252" height="30" fill="#070b11" opacity="0.9"/>
  <line x1="24" y1="398" x2="276" y2="398" stroke="#ffb347" stroke-width="0.8"/>
  <text x="150" y="417" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="2.5" fill="#d8d2c4">THE WATER THAT ISN'T</text>
</svg>
