<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="rsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080b11"/>
      <stop offset="0.55" stop-color="#0d1624"/>
      <stop offset="1" stop-color="#0f1a2a"/>
    </linearGradient>
    <linearGradient id="rroad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101b2c"/>
      <stop offset="1" stop-color="#0a1420"/>
    </linearGradient>
    <filter id="rgrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0.05 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#rsky)"/>

  <!-- skyline, layered -->
  <g fill="#0c1523">
    <rect x="40" y="120" width="90" height="180"/><rect x="150" y="90" width="70" height="210"/>
    <rect x="240" y="140" width="80" height="160"/><rect x="340" y="104" width="60" height="196"/>
    <rect x="420" y="150" width="90" height="150"/><rect x="700" y="120" width="80" height="180"/>
    <rect x="800" y="96" width="66" height="204"/><rect x="886" y="140" width="90" height="160"/>
    <rect x="996" y="110" width="70" height="190"/><rect x="1086" y="150" width="80" height="150"/>
  </g>
  <g fill="#0a0e14">
    <rect x="110" y="70" width="50" height="230"/><rect x="330" y="60" width="56" height="240"/>
    <rect x="760" y="56" width="52" height="244"/><rect x="1040" y="66" width="54" height="234"/>
  </g>
  <!-- windows -->
  <g fill="#ffb347" opacity="0.5">
    <rect x="58" y="140" width="5" height="7"/><rect x="76" y="170" width="5" height="7"/>
    <rect x="164" y="110" width="5" height="7"/><rect x="184" y="150" width="5" height="7"/>
    <rect x="352" y="84" width="5" height="7"/><rect x="782" y="80" width="5" height="7"/>
    <rect x="816" y="130" width="5" height="7"/><rect x="1062" y="90" width="5" height="7"/>
    <rect x="256" y="164" width="5" height="7"/><rect x="444" y="176" width="5" height="7"/>
    <rect x="912" y="166" width="5" height="7"/><rect x="1106" y="176" width="5" height="7"/>
  </g>
  <g fill="#29e6d2" opacity="0.4">
    <rect x="126" y="200" width="5" height="7"/><rect x="836" y="210" width="5" height="7"/>
  </g>
  <!-- neon signs -->
  <g>
    <rect x="366" y="120" width="8" height="42" fill="#ff2d78" opacity="0.75"/>
    <rect x="362" y="116" width="16" height="5" fill="#ff2d78" opacity="0.75"/>
    <rect x="820" y="170" width="30" height="7" fill="#29e6d2" opacity="0.7"/>
  </g>

  <!-- street: lamps + wet road with long reflections -->
  <rect x="0" y="296" width="1200" height="104" fill="url(#rroad)"/>
  <line x1="0" y1="296" x2="1200" y2="296" stroke="#22304a" stroke-width="1.6"/>
  <!-- lamp posts -->
  <g stroke="#1c2739" stroke-width="4">
    <line x1="180" y1="296" x2="180" y2="180"/><line x1="600" y1="296" x2="600" y2="180"/><line x1="1020" y1="296" x2="1020" y2="180"/>
  </g>
  <g stroke="#1c2739" stroke-width="4">
    <path d="M180 180 q0 -14 18 -14" fill="none"/><path d="M600 180 q0 -14 18 -14" fill="none"/><path d="M1020 180 q0 -14 18 -14" fill="none"/>
  </g>
  <g fill="#ffb347">
    <ellipse cx="200" cy="168" rx="8" ry="5"/><ellipse cx="620" cy="168" rx="8" ry="5"/><ellipse cx="1040" cy="168" rx="8" ry="5"/>
  </g>
  <g fill="#ffb347" opacity="0.25">
    <circle cx="200" cy="168" r="26"/><circle cx="620" cy="168" r="26"/><circle cx="1040" cy="168" r="26"/>
  </g>
  <!-- reflections, long and vertical -->
  <g stroke-width="3" opacity="0.4">
    <line x1="200" y1="300" x2="200" y2="392" stroke="#ffb347"/>
    <line x1="620" y1="300" x2="620" y2="380" stroke="#ffb347"/>
    <line x1="1040" y1="300" x2="1040" y2="396" stroke="#ffb347"/>
    <line x1="370" y1="300" x2="370" y2="360" stroke="#ff2d78"/>
    <line x1="834" y1="300" x2="834" y2="356" stroke="#29e6d2"/>
  </g>
  <g stroke="#31415f" stroke-width="1.4" opacity="0.5">
    <line x1="90" y1="316" x2="310" y2="316"/><line x1="480" y1="340" x2="760" y2="340"/>
    <line x1="900" y1="322" x2="1150" y2="322"/><line x1="140" y1="368" x2="420" y2="368"/>
  </g>

  <!-- the buskers under the overpass, mid-distance -->
  <g fill="#05070c">
    <path d="M470 250 q10 -8 20 0 l4 46 h-28 Z"/>
    <circle cx="480" cy="240" r="7"/>
    <path d="M474 238 q7 -5 13 -1 l-1 4 q-6 -3 -11 1 Z"/>
    <rect x="476" y="296" width="7" height="24"/><rect x="488" y="296" width="7" height="22"/>
    <path d="M508 262 q-2 22 4 34 l8 -2 q-4 -14 -2 -30 Z"/>
    <rect x="504" y="294" width="26" height="5"/>
  </g>
  <!-- saxophone note drift -->
  <g fill="#ffb347" opacity="0.6">
    <circle cx="540" cy="240" r="1.6"/><circle cx="556" cy="226" r="1.3"/><circle cx="570" cy="210" r="1"/>
  </g>

  <!-- rain, heavy -->
  <g stroke="#7f93b8" stroke-width="0.9" opacity="0.34">
    <line x1="60" y1="20" x2="40" y2="90"/><line x1="140" y1="40" x2="120" y2="110"/>
    <line x1="260" y1="16" x2="240" y2="86"/><line x1="390" y1="36" x2="370" y2="106"/>
    <line x1="520" y1="14" x2="500" y2="84"/><line x1="660" y1="40" x2="640" y2="110"/>
    <line x1="790" y1="18" x2="770" y2="88"/><line x1="920" y1="42" x2="900" y2="112"/>
    <line x1="1050" y1="16" x2="1030" y2="86"/><line x1="1160" y1="40" x2="1140" y2="110"/>
    <line x1="90" y1="180" x2="70" y2="250"/><line x1="330" y1="200" x2="310" y2="270"/>
    <line x1="560" y1="190" x2="540" y2="260"/><line x1="730" y1="210" x2="710" y2="280"/>
    <line x1="960" y1="186" x2="940" y2="256"/><line x1="1140" y1="206" x2="1120" y2="276"/>
  </g>

  <rect width="1200" height="400" filter="url(#rgrain)" opacity="0.5" fill="none"/>
</svg>
