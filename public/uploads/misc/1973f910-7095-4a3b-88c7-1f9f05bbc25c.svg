<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="iwall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="1" stop-color="#101626"/>
    </linearGradient>
    <radialGradient id="iwarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <filter id="igrain4">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0.045 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#iwall)"/>

  <!-- the floor: a painted crossing, receding -->
  <g fill="#141d30">
    <polygon points="0,400 1200,400 1200,368 0,330"/>
    <polygon points="60,352 160,340 190,368 90,380" opacity="0"/>
  </g>
  <g fill="#29e6d2" opacity="0.5">
    <polygon points="80,384 150,376 158,388 88,396"/>
    <polygon points="190,372 260,364 268,376 198,384"/>
    <polygon points="300,360 370,352 378,364 308,372"/>
    <polygon points="410,350 480,342 488,354 418,362"/>
    <polygon points="520,342 590,334 598,346 528,354"/>
    <polygon points="630,334 700,326 708,338 638,346"/>
    <polygon points="740,326 810,318 818,330 748,338"/>
    <polygon points="850,318 920,310 928,322 858,330"/>
    <polygon points="960,310 1030,302 1038,314 968,322"/>
  </g>

  <!-- the shelf of cold taps: rows of taps, all slightly dripping -->
  <g>
    <rect x="60" y="120" width="330" height="14" fill="#1c2739"/>
    <rect x="60" y="134" width="330" height="8" fill="#141d30"/>
    <g stroke="#31415f" stroke-width="2.4" fill="none">
      <path d="M90 120 v-22 q0 -8 8 -8 h10"/><path d="M150 120 v-22 q0 -8 8 -8 h10"/>
      <path d="M210 120 v-22 q0 -8 8 -8 h10"/><path d="M270 120 v-22 q0 -8 8 -8 h10"/>
      <path d="M330 120 v-22 q0 -8 8 -8 h10"/>
    </g>
    <g fill="#5b7396">
      <circle cx="94" cy="152" r="1.4"/><circle cx="154" cy="156" r="1.2"/>
      <circle cx="214" cy="150" r="1.4"/><circle cx="274" cy="157" r="1.2"/><circle cx="334" cy="153" r="1.3"/>
    </g>
  </g>

  <!-- the long counter: every cup still steaming -->
  <g>
    <rect x="470" y="210" width="420" height="16" fill="#1c2739"/>
    <rect x="470" y="226" width="420" height="10" fill="#141d30"/>
    <g fill="#0b1119" stroke="#31415f" stroke-width="1.4">
      <rect x="500" y="186" width="18" height="24" rx="3"/><rect x="556" y="186" width="18" height="24" rx="3"/>
      <rect x="612" y="186" width="18" height="24" rx="3"/><rect x="668" y="186" width="18" height="24" rx="3"/>
      <rect x="724" y="186" width="18" height="24" rx="3"/><rect x="780" y="186" width="18" height="24" rx="3"/>
      <rect x="836" y="186" width="18" height="24" rx="3"/>
    </g>
    <g stroke="#8fa3c4" stroke-width="1.2" fill="none" opacity="0.7">
      <path d="M509 182 q-3 -8 2 -14 q4 -6 1 -12"/><path d="M565 182 q-3 -8 2 -14 q4 -6 1 -12"/>
      <path d="M621 182 q-3 -8 2 -14 q4 -6 1 -12"/><path d="M677 182 q-3 -8 2 -14 q4 -6 1 -12"/>
      <path d="M733 182 q-3 -8 2 -14 q4 -6 1 -12"/><path d="M789 182 q-3 -8 2 -14 q4 -6 1 -12"/>
      <path d="M845 182 q-3 -8 2 -14 q4 -6 1 -12"/>
    </g>
    <circle cx="600" cy="170" r="60" fill="url(#iwarm)"/>
  </g>

  <!-- a door frame with no door -->
  <rect x="1010" y="96" width="90" height="220" fill="none" stroke="#37476b" stroke-width="3"/>
  <rect x="1022" y="108" width="66" height="196" fill="#070b11" opacity="0.6"/>
  <!-- through the frame: a painted crossing, vertical -->
  <g fill="#29e6d2" opacity="0.4">
    <rect x="1038" y="120" width="10" height="26"/><rect x="1038" y="156" width="10" height="26"/>
    <rect x="1038" y="192" width="10" height="26"/><rect x="1038" y="228" width="10" height="26"/>
    <rect x="1038" y="264" width="10" height="26"/>
  </g>

  <!-- wrong-scale furniture: one enormous cup, far left -->
  <g fill="none" stroke="#22304a" stroke-width="2">
    <path d="M60 240 q0 -36 44 -36 q44 0 44 36 l-6 60 h-76 Z"/>
    <path d="M148 222 q26 4 20 30 q-4 16 -22 18"/>
  </g>
  <path d="M74 218 q-3 -12 3 -22 M96 214 q-3 -12 3 -22" stroke="#5b7396" stroke-width="1.6" fill="none" opacity="0.6"/>

  <!-- motes -->
  <g fill="#ffb347">
    <circle cx="420" cy="120" r="1.3" opacity="0.6"/><circle cx="560" cy="90" r="1.1" opacity="0.5"/>
    <circle cx="920" cy="150" r="1.2" opacity="0.55"/><circle cx="300" cy="230" r="1" opacity="0.45"/>
  </g>

  <rect width="1200" height="400" filter="url(#igrain4)" opacity="0.5" fill="none"/>
</svg>
