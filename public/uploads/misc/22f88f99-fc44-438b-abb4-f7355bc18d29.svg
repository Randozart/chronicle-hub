<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="msky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#111a2c"/>
    </linearGradient>
    <radialGradient id="mstall" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <filter id="mgrain2">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0.05 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#msky)"/>

  <!-- lantern strings, three sagging lines -->
  <g fill="none" stroke="#1c2739" stroke-width="1.6">
    <path d="M0 70 Q300 110 600 70 T1200 70"/>
    <path d="M0 130 Q300 90 600 130 T1200 130"/>
  </g>
  <g>
    <g fill="#ffb347"><circle cx="90" cy="88" r="6"/><circle cx="300" cy="98" r="6"/><circle cx="520" cy="82" r="6"/><circle cx="760" cy="94" r="6"/><circle cx="980" cy="84" r="6"/><circle cx="1140" cy="96" r="6"/></g>
    <g fill="#ff2d78"><circle cx="180" cy="114" r="5"/><circle cx="420" cy="106" r="5"/><circle cx="660" cy="118" r="5"/><circle cx="880" cy="112" r="5"/><circle cx="1080" cy="122" r="5"/></g>
    <g fill="#29e6d2"><circle cx="240" cy="112" r="5"/><circle cx="480" cy="112" r="5"/><circle cx="720" cy="108" r="5"/><circle cx="1000" cy="120" r="5"/></g>
    <g fill="#ffb347" opacity="0.2">
      <circle cx="90" cy="88" r="16"/><circle cx="520" cy="82" r="16"/><circle cx="980" cy="84" r="16"/>
    </g>
  </g>

  <!-- stall tarps, receding both ways -->
  <g stroke="#22304a" stroke-width="1.6">
    <path d="M20 210 L190 196 L210 260 L10 268 Z" fill="#0d1522"/>
    <path d="M240 206 L410 194 L426 258 L226 264 Z" fill="#0b1320"/>
    <path d="M450 210 L620 198 L636 258 L436 264 Z" fill="#0d1522"/>
    <path d="M680 206 L850 196 L866 258 L666 264 Z" fill="#0b1320"/>
    <path d="M900 210 L1070 198 L1086 258 L886 264 Z" fill="#0d1522"/>
    <path d="M1110 208 L1200 200 L1200 260 L1096 262 Z" fill="#0b1320"/>
  </g>
  <!-- stall counters + wares hints -->
  <g stroke="#16203a" stroke-width="1.2" fill="#0a0f1a">
    <rect x="16" y="260" width="198" height="40"/><rect x="232" y="264" width="198" height="36"/>
    <rect x="442" y="264" width="198" height="38"/><rect x="672" y="264" width="198" height="36"/>
    <rect x="892" y="264" width="198" height="38"/>
  </g>
  <g fill="#ffb347" opacity="0.5">
    <rect x="50" y="270" width="10" height="12"/><rect x="290" y="272" width="10" height="12"/><rect x="740" y="272" width="10" height="12"/>
  </g>

  <!-- THE MEMORY STALL: lit between two dark ones -->
  <circle cx="600" cy="240" r="90" fill="url(#mstall)"/>
  <path d="M520 200 L600 178 L680 200 L668 268 L532 268 Z" fill="#12141c" stroke="#ffb347" stroke-width="1.6"/>
  <path d="M514 200 L600 174 L686 200" fill="none" stroke="#ffb347" stroke-width="2"/>
  <!-- its little window, jars of light -->
  <rect x="544" y="216" width="112" height="34" fill="#0a0f1a" stroke="#26334d" stroke-width="1.2"/>
  <g fill="#d8a54a">
    <rect x="554" y="228" width="10" height="16" rx="3" opacity="0.9"/>
    <rect x="574" y="224" width="12" height="20" rx="3" opacity="0.75"/>
    <rect x="596" y="230" width="9" height="14" rx="3" opacity="0.85"/>
    <rect x="616" y="225" width="11" height="19" rx="3" opacity="0.7"/>
    <rect x="636" y="229" width="9" height="15" rx="3" opacity="0.8"/>
  </g>
  <!-- the hand-lettered sign -->
  <text x="600" y="292" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="3" fill="#d8d2c4" opacity="0.9">YESTERDAYS BOUGHT</text>
  <text x="600" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="9" letter-spacing="2" fill="#5c6678">NO QUESTIONS ABOUT WHY</text>

  <!-- ground -->
  <rect x="0" y="302" width="1200" height="98" fill="#0a0f1a"/>
  <line x1="0" y1="302" x2="1200" y2="302" stroke="#22304a" stroke-width="1.6"/>
  <g stroke="#16203a" stroke-width="1" opacity="0.7">
    <line x1="150" y1="330" x2="420" y2="330"/><line x1="700" y1="356" x2="980" y2="356"/>
  </g>
  <!-- puddle reflection of the stall -->
  <g fill="#ffb347" opacity="0.12">
    <path d="M540 330 h120 l-16 18 h-88 Z"/>
  </g>
  <!-- a cat, of course, on the market ground -->
  <g fill="#05070c">
    <ellipse cx="880" cy="368" rx="16" ry="7"/>
    <circle cx="896" cy="360" r="5"/>
    <path d="M893 356 l2 -4 2 4 M899 356 l2 -4 2 4" stroke="#05070c" stroke-width="1.4"/>
    <path d="M866 368 q-8 2 -12 -2" stroke="#05070c" stroke-width="3" fill="none"/>
  </g>
  <path d="M880 374 q6 2 12 0" stroke="#ffb347" stroke-width="0.8" fill="none" opacity="0.4"/>

  <rect width="1200" height="400" filter="url(#mgrain2)" opacity="0.5" fill="none"/>
</svg>
