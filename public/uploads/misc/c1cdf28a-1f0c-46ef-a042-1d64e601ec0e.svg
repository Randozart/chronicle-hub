<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="600" height="900">
  <defs>
    <linearGradient id="bay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080b11"/>
      <stop offset="0.6" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0d1522"/>
    </linearGradient>
    <radialGradient id="termGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#29e6d2" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#29e6d2" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#29e6d2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.2" fill="#060a12" opacity="0.6"/>
    </pattern>
    <filter id="igrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0.05 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="300" height="450" fill="url(#bay)"/>

  <!-- ceiling cables -->
  <g stroke="#141d30" stroke-width="2" fill="none">
    <path d="M0 40 q75 26 150 10 t150 14"/>
    <path d="M0 66 q90 20 180 6 t120 18"/>
  </g>
  <g stroke="#141d30" stroke-width="1">
    <line x1="60" y1="52" x2="60" y2="96"/><line x1="180" y1="54" x2="180" y2="88"/><line x1="252" y1="62" x2="252" y2="92"/>
  </g>

  <!-- the pod behind, glass with repo notice -->
  <g>
    <rect x="196" y="120" width="88" height="150" fill="#0d1626" stroke="#26334d" stroke-width="1.6"/>
    <rect x="202" y="126" width="76" height="138" fill="#0a1220"/>
    <!-- a shape in the glass: the body, vague -->
    <path d="M212 240 q4 -60 28 -60 q24 0 28 60 Z" fill="#101c30"/>
    <circle cx="240" cy="160" r="11" fill="#101c30"/>
    <!-- scan sweep -->
    <rect x="202" y="150" width="76" height="2" fill="#29e6d2" opacity="0.35"/>
    <!-- repo notice taped on -->
    <rect x="216" y="136" width="34" height="26" fill="#d8d2c4" opacity="0.85"/>
    <g stroke="#8a3b3b" stroke-width="1.4">
      <line x1="221" y1="143" x2="245" y2="143"/><line x1="221" y1="149" x2="245" y2="149"/><line x1="221" y1="155" x2="237" y2="155"/>
    </g>
    <rect x="222" y="132" width="5" height="7" fill="#8a3b3b" opacity="0.7"/>
  </g>

  <!-- row of dead terminals -->
  <g>
    <rect x="20" y="150" width="44" height="34" fill="#0a0f18" stroke="#1c2739" stroke-width="1.4"/>
    <rect x="72" y="146" width="44" height="38" fill="#0a0f18" stroke="#1c2739" stroke-width="1.4"/>
    <rect x="124" y="152" width="44" height="32" fill="#0a0f18" stroke="#1c2739" stroke-width="1.4"/>
    <rect x="26" y="156" width="32" height="22" fill="#0c1322"/>
    <rect x="78" y="152" width="32" height="26" fill="#0c1322"/>
    <rect x="130" y="158" width="32" height="20" fill="#0c1322"/>
  </g>

  <!-- THE terminal, alive -->
  <g>
    <rect x="42" y="236" width="92" height="72" fill="#0a0f18" stroke="#26334d" stroke-width="1.6"/>
    <rect x="50" y="244" width="76" height="56" fill="#07131c"/>
    <circle cx="88" cy="272" r="32" fill="url(#termGlow)"/>
    <!-- the engram face: abstract, scan-lined -->
    <ellipse cx="88" cy="270" rx="19" ry="24" fill="#29e6d2" opacity="0.3"/>
    <ellipse cx="88" cy="270" rx="19" ry="24" fill="url(#scan)"/>
    <path d="M79 264 h7 M90 264 h7" stroke="#d8f5f0" stroke-width="1.6" opacity="0.8"/>
    <path d="M80 282 q8 5 16 0" stroke="#d8f5f0" stroke-width="1.2" fill="none" opacity="0.6"/>
    <!-- keyboard ledge -->
    <rect x="46" y="308" width="84" height="8" fill="#0c1322" stroke="#1c2739" stroke-width="1"/>
    <g fill="#26334d">
      <rect x="52" y="310" width="6" height="4"/><rect x="62" y="310" width="6" height="4"/><rect x="72" y="310" width="6" height="4"/>
      <rect x="82" y="310" width="6" height="4"/><rect x="92" y="310" width="6" height="4"/><rect x="102" y="310" width="6" height="4"/><rect x="112" y="310" width="6" height="4"/>
    </g>
  </g>

  <!-- desk edge -->
  <rect x="14" y="316" width="272" height="10" fill="#0b1119"/>
  <line x1="14" y1="316" x2="286" y2="316" stroke="#26334d" stroke-width="1.2"/>

  <!-- JUNO: seated before the terminal, tired-flat -->
  <!-- stool -->
  <rect x="128" y="372" width="34" height="7" fill="#0a0d14"/>
  <rect x="132" y="379" width="5" height="26" fill="#0a0d14"/>
  <rect x="154" y="379" width="5" height="26" fill="#0a0d14"/>
  <g fill="#04060b">
    <!-- torso leaning toward the screen -->
    <path d="M136 322 L162 326 L158 372 L134 372 Z"/>
    <!-- thighs forward, shins down -->
    <path d="M136 366 L104 366 L104 378 L136 376 Z"/>
    <rect x="102" y="376" width="9" height="28"/>
    <rect x="118" y="376" width="9" height="26"/>
    <!-- head + bun -->
    <circle cx="146" cy="310" r="9"/>
    <circle cx="157" cy="303" r="4.5"/>
    <!-- arm level to the keyboard -->
    <path d="M140 330 L100 320 L98 328 L140 338 Z"/>
  </g>
  <!-- her face lit by the screen: cyan rim only -->
  <path d="M138 305 q6 -4 12 -3" fill="none" stroke="#29e6d2" stroke-width="1.3" opacity="0.85"/>
  <path d="M138 314 q-4 3 -6 8" fill="none" stroke="#29e6d2" stroke-width="1" opacity="0.6"/>
  <path d="M104 322 L98 328" fill="none" stroke="#29e6d2" stroke-width="1" opacity="0.5"/>
  <!-- screen light pooling on the desk toward her -->
  <polygon points="130,318 200,318 214,332 118,332" fill="#29e6d2" opacity="0.08"/>
  <!-- her shadow long behind -->
  <ellipse cx="150" cy="406" rx="36" ry="5" fill="#04060b" opacity="0.7"/>

  <!-- floor cable running to the pod -->
  <path d="M20 430 q70 -10 130 -26 t130 -30" stroke="#141d30" stroke-width="3" fill="none"/>

  <rect width="300" height="450" filter="url(#igrain)" opacity="0.5" fill="none"/>

  <rect x="6" y="6" width="288" height="438" fill="none" stroke="#37476b" stroke-width="1.6"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#232f45" stroke-width="0.8"/>
  <g stroke="#ffb347" stroke-width="1.6">
    <line x1="6" y1="18" x2="6" y2="6"/><line x1="6" y1="6" x2="18" y2="6"/>
    <line x1="282" y1="6" x2="294" y2="6"/><line x1="294" y1="6" x2="294" y2="18"/>
    <line x1="6" y1="432" x2="6" y2="444"/><line x1="6" y1="444" x2="18" y2="444"/>
    <line x1="282" y1="444" x2="294" y2="444"/><line x1="294" y1="444" x2="294" y2="432"/>
  </g>

  <rect x="24" y="398" width="252" height="30" fill="#070b11" opacity="0.9"/>
  <line x1="24" y1="398" x2="276" y2="398" stroke="#29e6d2" stroke-width="0.8"/>
  <text x="150" y="417" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="2.5" fill="#d8d2c4">TERMINAL TEN</text>
</svg>
