<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="600" height="900">
  <defs>
    <linearGradient id="crypt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08090d"/>
      <stop offset="0.7" stop-color="#0d0f16"/>
      <stop offset="1" stop-color="#100f14"/>
    </linearGradient>
    <radialGradient id="candleGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#d98a3d" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d98a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plateGleam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="cgrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0.055 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="300" height="450" fill="url(#crypt)"/>

  <!-- the niche wall -->
  <g>
    <!-- niches rows -->
    <!-- row 1 (far, small) -->
    <g fill="none" stroke="#1c2230" stroke-width="1.2">
      <rect x="30" y="48" width="40" height="26"/><rect x="78" y="48" width="40" height="26"/>
      <rect x="126" y="48" width="40" height="26"/><rect x="174" y="48" width="40" height="26"/>
      <rect x="222" y="48" width="40" height="26"/>
    </g>
    <g stroke="#3d4658" stroke-width="1" opacity="0.5">
      <line x1="38" y1="62" x2="58" y2="62"/><line x1="42" y1="66" x2="54" y2="66"/>
      <line x1="86" y1="62" x2="106" y2="62"/><line x1="134" y1="62" x2="154" y2="62"/><line x1="138" y1="66" x2="150" y2="66"/>
      <line x1="182" y1="62" x2="202" y2="62"/><line x1="230" y1="62" x2="250" y2="62"/><line x1="234" y1="66" x2="246" y2="66"/>
    </g>
    <!-- row 2 -->
    <g fill="none" stroke="#1c2230" stroke-width="1.2">
      <rect x="26" y="92" width="48" height="32"/><rect x="82" y="92" width="48" height="32"/>
      <rect x="138" y="92" width="48" height="32"/><rect x="194" y="92" width="48" height="32"/>
    </g>
    <g stroke="#3d4658" stroke-width="1" opacity="0.55">
      <line x1="34" y1="108" x2="62" y2="108"/><line x1="38" y1="113" x2="58" y2="113"/>
      <line x1="90" y1="108" x2="118" y2="108"/><line x1="94" y1="113" x2="114" y2="113"/>
      <line x1="146" y1="108" x2="174" y2="108"/>
      <line x1="202" y1="108" x2="230" y2="108"/><line x1="206" y1="113" x2="226" y2="113"/>
    </g>
    <!-- row 3: contains THE BLANK PLATE -->
    <g fill="none" stroke="#1c2230" stroke-width="1.2">
      <rect x="22" y="142" width="56" height="38"/><rect x="86" y="142" width="56" height="38"/>
      <rect x="150" y="142" width="56" height="38"/><rect x="214" y="142" width="56" height="38"/>
    </g>
    <!-- filled plates with names -->
    <rect x="26" y="146" width="48" height="30" fill="#12141c"/>
    <g stroke="#3d4658" stroke-width="1" opacity="0.6">
      <line x1="32" y1="158" x2="66" y2="158"/><line x1="36" y1="164" x2="62" y2="164"/>
    </g>
    <rect x="154" y="146" width="48" height="30" fill="#12141c"/>
    <g stroke="#3d4658" stroke-width="1" opacity="0.6">
      <line x1="160" y1="158" x2="194" y2="158"/><line x1="164" y1="164" x2="190" y2="164"/>
    </g>
    <rect x="218" y="146" width="48" height="30" fill="#12141c"/>
    <g stroke="#3d4658" stroke-width="1" opacity="0.6">
      <line x1="224" y1="158" x2="258" y2="158"/><line x1="228" y1="164" x2="252" y2="164"/>
    </g>
    <!-- THE BLANK PLATE: empty, gleaming -->
    <rect x="90" y="146" width="48" height="30" fill="url(#plateGleam)"/>
    <rect x="90" y="146" width="48" height="30" fill="none" stroke="#ffb347" stroke-width="1" opacity="0.7"/>
    <path d="M96 152 L116 172" stroke="#ffdf9e" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- row 4 (near, larger, darker) -->
  <g fill="none" stroke="#181d2a" stroke-width="1.3">
    <rect x="16" y="198" width="64" height="44"/><rect x="88" y="198" width="64" height="44"/>
    <rect x="160" y="198" width="64" height="44"/><rect x="232" y="198" width="52" height="44"/>
  </g>
  <g stroke="#2e3648" stroke-width="1" opacity="0.5">
    <line x1="26" y1="220" x2="66" y2="220"/><line x1="98" y1="220" x2="140" y2="220"/>
    <line x1="170" y1="220" x2="212" y2="220"/>
  </g>

  <!-- floor -->
  <rect x="0" y="330" width="300" height="120" fill="#0a0a10"/>
  <line x1="0" y1="330" x2="300" y2="330" stroke="#1c2230" stroke-width="1.4"/>

  <!-- candle stub, foreground right -->
  <g>
    <ellipse cx="226" cy="368" rx="70" ry="26" fill="url(#candleGlow)"/>
    <rect x="218" y="330" width="16" height="38" fill="#d8d2c4" opacity="0.9"/>
    <path d="M218 336 q8 4 16 0 M218 344 q8 4 16 0" stroke="#b8b2a4" stroke-width="1" fill="none" opacity="0.6"/>
    <!-- wick + flame -->
    <line x1="226" y1="330" x2="226" y2="322" stroke="#06060a" stroke-width="1.4"/>
    <path d="M226 304 q7 10 3 17 q-3 5 -6 0 q-4 -7 3 -17 Z" fill="#ffb347"/>
    <path d="M226 310 q4 6 1 11 q-2 3 -3 0 q-2 -5 2 -11 Z" fill="#ffdf9e"/>
  </g>
  <!-- long shadows from the candle -->
  <g stroke="#05050a" stroke-width="10" opacity="0.7">
    <line x1="216" y1="352" x2="120" y2="420"/>
    <line x1="232" y1="356" x2="180" y2="430"/>
  </g>
  <!-- warm pool on the floor -->
  <ellipse cx="226" cy="372" rx="80" ry="16" fill="#ffb347" opacity="0.07"/>
  <!-- candle reflection on floor -->
  <rect x="219" y="368" width="14" height="26" fill="#d8d2c4" opacity="0.2"/>

  <rect width="300" height="450" filter="url(#cgrain)" opacity="0.55" fill="none"/>

  <rect x="6" y="6" width="288" height="438" fill="none" stroke="#37476b" stroke-width="1.6"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#232f45" stroke-width="0.8"/>
  <g stroke="#ffb347" stroke-width="1.6">
    <line x1="6" y1="18" x2="6" y2="6"/><line x1="6" y1="6" x2="18" y2="6"/>
    <line x1="282" y1="6" x2="294" y2="6"/><line x1="294" y1="6" x2="294" y2="18"/>
    <line x1="6" y1="432" x2="6" y2="444"/><line x1="6" y1="444" x2="18" y2="444"/>
    <line x1="282" y1="444" x2="294" y2="444"/><line x1="294" y1="444" x2="294" y2="432"/>
  </g>

  <rect x="24" y="398" width="252" height="30" fill="#070b11" opacity="0.9"/>
  <line x1="24" y1="398" x2="276" y2="398" stroke="#ffb347" stroke-width="0.8"/>
  <text x="150" y="417" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="2.5" fill="#d8d2c4">THE BLANK PLATE</text>
</svg>
